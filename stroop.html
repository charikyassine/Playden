<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Color Clash · Playden</title><link rel="icon" href="../logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
 :root{--accent:#7a5cff;--accent-2:#00b8d4;--bg:#eef0ff;--bg2:#e0e6ff;--text:#1a1440}
 *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
 body{background:linear-gradient(160deg,var(--bg),var(--bg2));min-height:100vh;font-family:'Inter',sans-serif;color:var(--text);display:flex;flex-direction:column;align-items:center;padding:16px}
 a.back{align-self:flex-start;text-decoration:none;color:var(--accent);font-family:'Baloo 2';font-weight:700}
 h1{font-family:'Baloo 2';font-weight:800;font-size:1.7rem;margin:6px 0;background:linear-gradient(100deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
 .score{font-family:'Baloo 2';font-weight:700;margin-bottom:10px}
 .msg{font-family:'Baloo 2';font-weight:700;margin-top:12px;min-height:24px;text-align:center}
 .btn{margin-top:10px;border:0;border-radius:999px;padding:10px 24px;font-family:'Baloo 2';font-weight:700;color:#fff;background:linear-gradient(100deg,var(--accent),var(--accent-2));cursor:pointer} .word{font-family:'Baloo 2';font-weight:800;font-size:3rem;margin:18px 0}
 .opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:min(84vw,320px)}
 .opts button{border:0;border-radius:14px;padding:16px;font-family:'Baloo 2';font-weight:800;font-size:1.1rem;background:#fff;color:var(--text);cursor:pointer;box-shadow:0 5px 14px rgba(122,92,255,.14)}
</style></head><body>
<a class="back" href="../index.html">← Playden</a><h1>🎨 Color Clash</h1>
<div class="score">Score: <span id="s">0</span> · Time: <span id="t">30</span>s · Best: <span id="b">0</span></div>
<div class="word" id="w">Ready?</div>
<div class="opts" id="o"></div>
<div class="msg" id="m">Tap the COLOR of the text, not the word!</div>
<button class="btn" id="r">Start</button>
<script>
const COLORS=[['Red','#ff4d6d'],['Blue','#3a7dff'],['Green','#12c46b'],['Purple','#7a5cff'],['Orange','#ff8a3d']];
let score,time,ansColor,playing=false,tick,best=+(localStorage.getItem('stroopBest')||0);
document.getElementById('b').textContent=best;const O=document.getElementById('o');
function round(){const w=COLORS[(Math.random()*COLORS.length)|0];let c;do{c=COLORS[(Math.random()*COLORS.length)|0];}while(c===w);ansColor=c[0];
 const W=document.getElementById('w');W.textContent=w[0];W.style.color=c[1];
 const arr=[...COLORS].sort(()=>Math.random()-.5);O.innerHTML='';arr.forEach(col=>{const b=document.createElement('button');b.textContent=col[0];b.onclick=()=>pick(col[0]);O.appendChild(b);});}
function pick(name){if(!playing)return;if(name===ansColor){score++;}else{score=Math.max(0,score-1);}document.getElementById('s').textContent=score;round();}
function start(){if(playing)return;playing=true;score=0;time=30;document.getElementById('s').textContent=0;document.getElementById('t').textContent=30;round();tick=setInterval(()=>{time--;document.getElementById('t').textContent=time;if(time<=0)end();},1000);}
function end(){playing=false;clearInterval(tick);document.getElementById('w').textContent='⏰';document.getElementById('w').style.color='var(--text)';O.innerHTML='';document.getElementById('m').textContent='Score: '+score;if(score>best){best=score;localStorage.setItem('stroopBest',best);document.getElementById('b').textContent=best;}}
document.getElementById('r').onclick=start;
</script></body></html>
