<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Whack-a-Mole · Playden</title><link rel="icon" href="../logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
 :root{--accent:#ff2e88;--accent-2:#ff7a3d;--bg:#fff0f6;--bg2:#ffe1ee;--text:#2a0f1e}
 *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
 body{background:linear-gradient(160deg,var(--bg),var(--bg2));min-height:100vh;font-family:'Inter',sans-serif;color:var(--text);display:flex;flex-direction:column;align-items:center;padding:16px}
 a.back{align-self:flex-start;text-decoration:none;color:var(--accent);font-family:'Baloo 2';font-weight:700}
 h1{font-family:'Baloo 2';font-weight:800;font-size:1.8rem;margin:6px 0;background:linear-gradient(100deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
 .score{font-family:'Baloo 2';font-weight:700;margin-bottom:10px}
 #g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(88vw,340px)}
 .hole{aspect-ratio:1;border-radius:50%;background:#ffd9ea;display:grid;place-items:center;font-size:clamp(2rem,12vw,3rem);cursor:pointer;box-shadow:inset 0 6px 14px rgba(255,46,136,.18);user-select:none}
 .hole.up{background:linear-gradient(135deg,#fff,#ffe6f1)}
 .msg{font-family:'Baloo 2';font-weight:700;margin-top:14px;min-height:24px}
 .btn{margin-top:10px;border:0;border-radius:999px;padding:10px 24px;font-family:'Baloo 2';font-weight:700;color:#fff;background:linear-gradient(100deg,var(--accent),var(--accent-2));cursor:pointer}
</style></head><body>
<a class="back" href="../index.html">← Playden</a>
<h1>🔨 Whack-a-Mole</h1>
<div class="score">Score: <span id="s">0</span> · Time: <span id="t">30</span>s · Best: <span id="b">0</span></div>
<div id="g"></div>
<div class="msg" id="m">Press Start and tap the moles!</div>
<button class="btn" id="r">Start</button>
<script>
const G=document.getElementById('g');let holes=[],score,time,playing=false,pop,tick,best=+(localStorage.getItem('whackBest')||0);
document.getElementById('b').textContent=best;
for(let i=0;i<9;i++){const h=document.createElement('div');h.className='hole';h.addEventListener('click',()=>hit(i));G.appendChild(h);holes.push(h);}
function start(){if(playing)return;playing=true;score=0;time=30;document.getElementById('s').textContent=0;document.getElementById('t').textContent=30;document.getElementById('m').textContent='Whack them!';
 pop=setInterval(show,750);tick=setInterval(()=>{time--;document.getElementById('t').textContent=time;if(time<=0)end();},1000);show();}
function show(){holes.forEach(h=>{h.classList.remove('up');h.textContent='';});const i=(Math.random()*9)|0;holes[i].classList.add('up');holes[i].textContent='🐹';}
function hit(i){if(!playing||!holes[i].classList.contains('up'))return;score++;document.getElementById('s').textContent=score;holes[i].classList.remove('up');holes[i].textContent='💥';setTimeout(()=>{if(holes[i].textContent==='💥')holes[i].textContent='';},150);}
function end(){playing=false;clearInterval(pop);clearInterval(tick);holes.forEach(h=>{h.classList.remove('up');h.textContent='';});document.getElementById('m').textContent='⏰ Time! Score '+score;if(score>best){best=score;localStorage.setItem('whackBest',best);document.getElementById('b').textContent=best;}}
document.getElementById('r').addEventListener('click',start);
</script></body></html>
