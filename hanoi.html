<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tower of Hanoi · Playden</title><link rel="icon" href="../logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
 :root{--accent:#7a5cff;--accent-2:#00b8d4;--bg:#eef0ff;--bg2:#e0e6ff;--text:#1a1440}
 *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
 body{background:linear-gradient(160deg,var(--bg),var(--bg2));min-height:100vh;font-family:'Inter',sans-serif;color:var(--text);display:flex;flex-direction:column;align-items:center;padding:16px}
 a.back{align-self:flex-start;text-decoration:none;color:var(--accent);font-family:'Baloo 2';font-weight:700}
 h1{font-family:'Baloo 2';font-weight:800;font-size:1.7rem;margin:6px 0;background:linear-gradient(100deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
 .score{font-family:'Baloo 2';font-weight:700;margin-bottom:10px}
 .msg{font-family:'Baloo 2';font-weight:700;margin-top:12px;min-height:24px;text-align:center}
 .btn{margin-top:10px;border:0;border-radius:999px;padding:10px 24px;font-family:'Baloo 2';font-weight:700;color:#fff;background:linear-gradient(100deg,var(--accent),var(--accent-2));cursor:pointer} #g{display:flex;justify-content:space-around;width:min(94vw,420px);height:200px;margin-top:10px}
 .peg{position:relative;width:30%;display:flex;flex-direction:column-reverse;align-items:center;cursor:pointer}
 .peg::before{content:"";position:absolute;bottom:0;width:6px;height:100%;background:#c9cffb;border-radius:3px}
 .peg::after{content:"";position:absolute;bottom:0;width:100%;height:8px;background:#c9cffb;border-radius:4px}
 .disk{height:22px;border-radius:6px;margin-bottom:3px;z-index:1;background:linear-gradient(100deg,var(--accent),var(--accent-2));box-shadow:0 2px 6px rgba(122,92,255,.3)}
 .peg.sel::after{background:var(--accent)}
</style></head><body>
<a class="back" href="../index.html">← Playden</a><h1>🗼 Tower of Hanoi</h1>
<div class="score">Moves: <span id="mv">0</span> · Best possible: 7</div>
<div id="g"></div>
<div class="msg" id="m">Move all disks to the last peg. Big can never sit on small.</div>
<button class="btn" id="r">Restart</button>
<script>
const G=document.getElementById('g');let pegs,sel,moves;
function draw(){G.innerHTML='';pegs.forEach((p,pi)=>{const peg=document.createElement('div');peg.className='peg'+(sel===pi?' sel':'');peg.onclick=()=>click(pi);
 p.forEach(size=>{const d=document.createElement('div');d.className='disk';d.style.width=(30+size*22)+'%';peg.appendChild(d);});G.appendChild(peg);});}
function click(pi){if(sel===null){if(pegs[pi].length)sel=pi;}else{if(pi===sel){sel=null;}else{const from=pegs[sel],to=pegs[pi];const d=from[from.length-1];if(!to.length||to[to.length-1]>d){to.push(from.pop());moves++;document.getElementById('mv').textContent=moves;}sel=null;if(pegs[2].length===3)document.getElementById('m').textContent='🎉 Solved in '+moves+' moves!';}}draw();}
function reset(){pegs=[[3,2,1],[],[]];sel=null;moves=0;document.getElementById('mv').textContent=0;document.getElementById('m').textContent='Move all disks to the last peg';draw();}
document.getElementById('r').onclick=reset;reset();
</script></body></html>
