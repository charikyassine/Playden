<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tic-Tac-Toe · Playden</title><link rel="icon" href="../logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
 :root{--accent:#ff2e88;--accent-2:#ff7a3d;--bg:#fff0f6;--bg2:#ffe1ee;--text:#2a0f1e}
 *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
 body{background:linear-gradient(160deg,var(--bg),var(--bg2));min-height:100vh;font-family:'Inter',sans-serif;color:var(--text);display:flex;flex-direction:column;align-items:center;padding:16px}
 a.back{align-self:flex-start;text-decoration:none;color:var(--accent);font-family:'Baloo 2';font-weight:700}
 h1{font-family:'Baloo 2';font-weight:800;font-size:1.8rem;margin:6px 0;background:linear-gradient(100deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
 .msg{font-family:'Baloo 2';font-weight:700;margin:6px 0 12px;min-height:24px}
 #g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(88vw,320px)}
 .cell{aspect-ratio:1;border-radius:14px;background:#fff;box-shadow:0 5px 14px rgba(255,46,136,.14);display:grid;place-items:center;font-family:'Baloo 2';font-weight:800;font-size:clamp(2rem,12vw,3rem);cursor:pointer}
 .cell.x{color:var(--accent)}.cell.o{color:var(--accent-2)}
 .btn{margin-top:14px;border:0;border-radius:999px;padding:10px 24px;font-family:'Baloo 2';font-weight:700;color:#fff;background:linear-gradient(100deg,var(--accent),var(--accent-2));cursor:pointer}
</style></head><body>
<a class="back" href="../index.html">← Playden</a>
<h1>⭕ Tic-Tac-Toe</h1>
<div class="msg" id="m">You're ✖ — tap a square</div>
<div id="g"></div>
<button class="btn" id="r">New game</button>
<script>
const G=document.getElementById('g'),M=document.getElementById('m');let b,over;
const WIN=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function reset(){b=Array(9).fill('');over=false;M.textContent="You're ✖ — tap a square";G.innerHTML='';
 b.forEach((_,i)=>{const c=document.createElement('div');c.className='cell';c.addEventListener('click',()=>play(i));G.appendChild(c);});}
function render(){[...G.children].forEach((c,i)=>{c.textContent=b[i]==='X'?'✖':b[i]==='O'?'◯':'';c.className='cell'+(b[i]==='X'?' x':b[i]==='O'?' o':'');});}
function winner(p){return WIN.some(w=>w.every(i=>b[i]===p));}
function play(i){if(over||b[i])return;b[i]='X';render();if(check())return;setTimeout(ai,300);}
function ai(){if(over)return;let m=best('O')??best('X')??([4].find(i=>!b[i]))??b.map((v,i)=>v?-1:i).filter(i=>i>=0)[0];if(m!=null&&b[m]===''){b[m]='O';render();check();}}
function best(p){for(const w of WIN){const line=w.map(i=>b[i]),idx=w[line.indexOf('')];if(line.filter(v=>v===p).length===2&&line.includes(''))return idx;}return null;}
function check(){if(winner('X')){M.textContent='🎉 You win!';over=true;return true;}if(winner('O')){M.textContent='😅 Computer wins';over=true;return true;}if(!b.includes('')){M.textContent="It's a draw!";over=true;return true;}return false;}
document.getElementById('r').addEventListener('click',reset);reset();
</script></body></html>
