<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Brick Breaker · Playden</title><link rel="icon" href="../logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
 :root{--accent:#ff2e88;--accent-2:#ff7a3d;--bg:#fff0f6;--bg2:#ffe1ee;--text:#2a0f1e}
 *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
 body{background:linear-gradient(160deg,var(--bg),var(--bg2));min-height:100vh;font-family:'Inter',sans-serif;color:var(--text);display:flex;flex-direction:column;align-items:center;padding:16px}
 a.back{align-self:flex-start;text-decoration:none;color:var(--accent);font-family:'Baloo 2';font-weight:700}
 h1{font-family:'Baloo 2';font-weight:800;font-size:1.8rem;margin:6px 0;background:linear-gradient(100deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
 .score{font-family:'Baloo 2';font-weight:700;margin-bottom:10px}
 canvas{background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(255,46,136,.18);touch-action:none;max-width:92vw;height:auto}
 .msg{font-family:'Baloo 2';font-weight:700;margin-top:12px;min-height:24px}
 .btn{margin-top:10px;border:0;border-radius:999px;padding:10px 24px;font-family:'Baloo 2';font-weight:700;color:#fff;background:linear-gradient(100deg,var(--accent),var(--accent-2));cursor:pointer}
</style></head><body>
<a class="back" href="../index.html">← Playden</a>
<h1>🧱 Brick Breaker</h1>
<div class="score">Score: <span id="s">0</span> · Lives: <span id="l">3</span></div>
<canvas id="c" width="360" height="440"></canvas>
<div class="msg" id="m">Move with mouse or finger</div>
<button class="btn" id="r">New game</button>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=cv.width,H=cv.height;
let paddle,ball,bricks,score,lives,run;
const PW=70,PH=12,R=7,COLS=7,ROWS=5,BW=44,BH=18,GAP=6,TOP=40;
function reset(){paddle=W/2-PW/2;ball={x:W/2,y:H-40,vx:3,vy:-3};score=0;lives=3;bricks=[];
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)bricks.push({x:c*(BW+GAP)+GAP+8,y:r*(BH+GAP)+TOP,alive:true,r});
 document.getElementById('s').textContent=0;document.getElementById('l').textContent=3;document.getElementById('m').textContent='Move with mouse or finger';
 cancelAnimationFrame(run);loop();}
function loop(){update();draw();run=requestAnimationFrame(loop);}
function update(){ball.x+=ball.vx;ball.y+=ball.vy;
 if(ball.x<R||ball.x>W-R)ball.vx*=-1;
 if(ball.y<R)ball.vy*=-1;
 if(ball.y>H-24-R&&ball.x>paddle&&ball.x<paddle+PW&&ball.vy>0){ball.vy*=-1;ball.vx=((ball.x-(paddle+PW/2))/(PW/2))*4;}
 if(ball.y>H){lives--;document.getElementById('l').textContent=lives;if(lives<=0){document.getElementById('m').textContent='Game over! Score '+score;cancelAnimationFrame(run);return;}ball={x:W/2,y:H-40,vx:3,vy:-3};}
 bricks.forEach(b=>{if(b.alive&&ball.x>b.x&&ball.x<b.x+BW&&ball.y>b.y&&ball.y<b.y+BH){b.alive=false;ball.vy*=-1;score+=10;document.getElementById('s').textContent=score;}});
 if(bricks.every(b=>!b.alive)){document.getElementById('m').textContent='🎉 You cleared it! Score '+score;cancelAnimationFrame(run);}}
function draw(){ctx.clearRect(0,0,W,H);
 const cols=['#ff2e88','#ff5c9d','#ff7a3d','#ffab5c','#ffd23f'];
 bricks.forEach(b=>{if(!b.alive)return;ctx.fillStyle=cols[b.r%cols.length];rr(b.x,b.y,BW,BH,5);ctx.fill();});
 ctx.fillStyle='#ff2e88';rr(paddle,H-24,PW,PH,6);ctx.fill();
 ctx.fillStyle='#ff7a3d';ctx.beginPath();ctx.arc(ball.x,ball.y,R,0,7);ctx.fill();}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function move(clientX){const rect=cv.getBoundingClientRect();const x=(clientX-rect.left)*(W/rect.width);paddle=Math.max(0,Math.min(W-PW,x-PW/2));}
cv.addEventListener('mousemove',e=>move(e.clientX));
cv.addEventListener('touchmove',e=>{move(e.touches[0].clientX);},{passive:true});
document.getElementById('r').addEventListener('click',reset);reset();
</script></body></html>
