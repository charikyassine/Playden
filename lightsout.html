<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Lights Out · Playden</title><link rel="icon" href="../logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
 :root{--accent:#7a5cff;--accent-2:#00b8d4;--bg:#eef0ff;--bg2:#e0e6ff;--text:#1a1440}
 *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
 body{background:linear-gradient(160deg,var(--bg),var(--bg2));min-height:100vh;font-family:'Inter',sans-serif;color:var(--text);display:flex;flex-direction:column;align-items:center;padding:16px}
 a.back{align-self:flex-start;text-decoration:none;color:var(--accent);font-family:'Baloo 2';font-weight:700}
 h1{font-family:'Baloo 2';font-weight:800;font-size:1.7rem;margin:6px 0;background:linear-gradient(100deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
 .score{font-family:'Baloo 2';font-weight:700;margin-bottom:10px}
 .msg{font-family:'Baloo 2';font-weight:700;margin-top:12px;min-height:24px;text-align:center}
 .btn{margin-top:10px;border:0;border-radius:999px;padding:10px 24px;font-family:'Baloo 2';font-weight:700;color:#fff;background:linear-gradient(100deg,var(--accent),var(--accent-2));cursor:pointer} #g{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:min(84vw,320px);aspect-ratio:1}
 .c{border-radius:10px;cursor:pointer;background:#c9cffb;transition:background .15s;box-shadow:inset 0 2px 6px rgba(0,0,0,.06)}
 .c.on{background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 4px 12px rgba(122,92,255,.4)}
</style></head><body>
<a class="back" href="../index.html">← Playden</a><h1>💡 Lights Out</h1>
<div class="score">Moves: <span id="mv">0</span></div>
<div id="g"></div>
<div class="msg" id="m">Turn all the lights OFF. Tapping flips a cross of lights.</div>
<button class="btn" id="r">New puzzle</button>
<script>
const N=5,G=document.getElementById('g');let grid,moves,cells=[];
for(let i=0;i<N*N;i++){const d=document.createElement('div');d.className='c';d.onclick=()=>tap(i);G.appendChild(d);cells.push(d);}
function draw(){cells.forEach((c,i)=>c.classList.toggle('on',grid[i]===1));}
function flip(i){grid[i]^=1;}
function tap(i){const r=(i/N)|0,c=i%N;flip(i);if(r>0)flip(i-N);if(r<N-1)flip(i+N);if(c>0)flip(i-1);if(c<N-1)flip(i+1);moves++;document.getElementById('mv').textContent=moves;draw();if(grid.every(v=>v===0))document.getElementById('m').textContent='🎉 Solved in '+moves+' moves!';}
function make(){grid=Array(N*N).fill(0);moves=0;document.getElementById('mv').textContent=0;document.getElementById('m').textContent='Turn all the lights OFF';
 // scramble by pressing random cells (guarantees solvable)
 for(let k=0;k<8+((Math.random()*6)|0);k++){const i=(Math.random()*N*N)|0;const r=(i/N)|0,c=i%N;flip(i);if(r>0)flip(i-N);if(r<N-1)flip(i+N);if(c>0)flip(i-1);if(c<N-1)flip(i+1);}
 if(grid.every(v=>v===0))grid[12]=1;draw();}
document.getElementById('r').onclick=make;make();
</script></body></html>
