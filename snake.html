<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Snake · Playden</title><link rel="icon" href="../logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
 :root{--accent:#ff2e88;--accent-2:#ff7a3d;--bg:#fff0f6;--bg2:#ffe1ee;--text:#2a0f1e}
 *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
 body{background:linear-gradient(160deg,var(--bg),var(--bg2));min-height:100vh;font-family:'Inter',sans-serif;color:var(--text);display:flex;flex-direction:column;align-items:center;padding:16px}
 a.back{align-self:flex-start;text-decoration:none;color:var(--accent);font-family:'Baloo 2';font-weight:700}
 h1{font-family:'Baloo 2';font-weight:800;font-size:1.8rem;margin:6px 0;background:linear-gradient(100deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
 .score{font-family:'Baloo 2';font-weight:700;margin-bottom:10px}
 canvas{background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(255,46,136,.18);touch-action:none;max-width:92vw;height:auto}
 .pad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:6px;margin-top:16px}
 .pad button{border:0;border-radius:12px;background:#fff;box-shadow:0 4px 12px rgba(255,46,136,.15);font-size:1.3rem;font-weight:700;color:var(--accent);cursor:pointer}
 .pad .up{grid-column:2;grid-row:1}.pad .left{grid-column:1;grid-row:2}.pad .right{grid-column:3;grid-row:2}.pad .down{grid-column:2;grid-row:3}
 .msg{font-family:'Baloo 2';font-weight:700;margin-top:12px;min-height:24px}
 .btn{margin-top:10px;border:0;border-radius:999px;padding:10px 24px;font-family:'Baloo 2';font-weight:700;color:#fff;background:linear-gradient(100deg,var(--accent),var(--accent-2));cursor:pointer}
</style></head><body>
<a class="back" href="../index.html">← Playden</a>
<h1>🐍 Snake</h1>
<div class="score">Score: <span id="s">0</span> · Best: <span id="b">0</span></div>
<canvas id="c" width="360" height="360"></canvas>
<div class="msg" id="m">Use arrows, WASD, or swipe</div>
<button class="btn" id="r">New game</button>
<div class="pad">
 <button class="up" data-d="U">▲</button><button class="left" data-d="L">◀</button>
 <button class="right" data-d="R">▶</button><button class="down" data-d="D">▼</button>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),N=18,S=cv.width/N;
let snake,dir,food,score,best=+(localStorage.getItem('snakeBest')||0),loop,alive;
document.getElementById('b').textContent=best;
function reset(){snake=[{x:9,y:9}];dir={x:0,y:0};food=spawn();score=0;alive=true;document.getElementById('s').textContent=0;document.getElementById('m').textContent='Use arrows, WASD, or swipe';clearInterval(loop);loop=setInterval(tick,110);draw();}
function spawn(){let p;do{p={x:(Math.random()*N)|0,y:(Math.random()*N)|0}}while(snake&&snake.some(s=>s.x===p.x&&s.y===p.y));return p;}
function tick(){if(!alive)return;if(dir.x===0&&dir.y===0){draw();return;}
 const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
 if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(s=>s.x===h.x&&s.y===h.y)){return over();}
 snake.unshift(h);
 if(h.x===food.x&&h.y===food.y){score++;document.getElementById('s').textContent=score;food=spawn();}else{snake.pop();}
 draw();}
function draw(){ctx.clearRect(0,0,cv.width,cv.height);
 ctx.fillStyle='#ff7a3d';ctx.beginPath();ctx.arc(food.x*S+S/2,food.y*S+S/2,S/2-2,0,7);ctx.fill();
 snake.forEach((s,i)=>{ctx.fillStyle=i===0?'#ff2e88':'#ff77b0';const r=6;const x=s.x*S+1,y=s.y*S+1,w=S-2;ctx.beginPath();ctx.roundRect(x,y,w,w,r);ctx.fill();});}
function over(){alive=false;clearInterval(loop);if(score>best){best=score;localStorage.setItem('snakeBest',best);document.getElementById('b').textContent=best;}document.getElementById('m').textContent='Game over! Score '+score;}
function set(d){const m={U:{x:0,y:-1},D:{x:0,y:1},L:{x:-1,y:0},R:{x:1,y:0}}[d];if(!m)return;if(m.x===-dir.x&&m.y===-dir.y)return;dir=m;}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();({arrowup:'U',w:'U',arrowdown:'D',s:'D',arrowleft:'L',a:'L',arrowright:'R',d:'R'})[k]&&(e.preventDefault(),set(({arrowup:'U',w:'U',arrowdown:'D',s:'D',arrowleft:'L',a:'L',arrowright:'R',d:'R'})[k]));});
document.querySelectorAll('.pad button').forEach(b=>b.addEventListener('click',()=>set(b.dataset.d)));
let tx,ty;cv.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
cv.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>Math.abs(dy))set(dx>0?'R':'L');else set(dy>0?'D':'U');});
document.getElementById('r').addEventListener('click',reset);
if(!ctx.roundRect){ctx.roundRect=function(x,y,w,h,r){this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);};}
reset();
</script></body></html>
