<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="focus">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playden — brain games that make you sharper</title>
<meta name="description" content="Playden — free brain-training games: memory, logic, focus and math. Play in your language, theme your way. English, العربية, Français, Español.">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Cairo:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--font-display:'Baloo 2',system-ui,sans-serif;--font-body:'Inter',system-ui,sans-serif}
  html[lang="ar"]{--font-display:'Cairo',system-ui,sans-serif;--font-body:'Cairo',system-ui,sans-serif}
  [data-theme="focus"]{--bg:#eef0ff;--bg2:#e0e6ff;--surface:#fff;--accent:#7a5cff;--accent-2:#00b8d4;--text:#1a1440;--muted:#6b6a9c;--line:rgba(122,92,255,.16);--glow:122,92,255;--ink:#fff}
  [data-theme="sunrise"]{--bg:#fff0f6;--bg2:#ffe1ee;--surface:#fff;--accent:#ff2e88;--accent-2:#ff7a3d;--text:#2a0f1e;--muted:#a25c7d;--line:rgba(255,46,136,.16);--glow:255,46,136;--ink:#fff}
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:linear-gradient(160deg,var(--bg),var(--bg2));background-attachment:fixed;color:var(--text);font-family:var(--font-body);min-height:100vh;transition:background .5s;overflow-x:hidden}
  .glow-orb{position:fixed;top:-25%;left:50%;transform:translateX(-50%);width:720px;height:720px;max-width:130vw;background:radial-gradient(circle,rgba(var(--glow),.2),transparent 62%);pointer-events:none;z-index:0;transition:background .5s;animation:float 8s ease-in-out infinite alternate}
  @keyframes float{from{transform:translateX(-50%) translateY(0) scale(1)}to{transform:translateX(-50%) translateY(30px) scale(1.08)}}
  @keyframes bob{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-14px) rotate(2deg)}}
  .wrap{position:relative;z-index:1;max-width:1060px;margin:0 auto;padding:22px 20px 60px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px}.brand .mark{width:42px;height:42px}
  .brand .name{font-family:var(--font-display);font-weight:800;font-size:1.55rem;letter-spacing:-.5px;background:linear-gradient(100deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  select.lang{font-family:var(--font-body);font-weight:600;font-size:.82rem;color:var(--text);background:var(--surface);border:1px solid var(--line);outline:0;padding:8px 12px;border-radius:999px;cursor:pointer}
  .toggle{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px}
  .toggle button{font-family:var(--font-display);font-weight:600;font-size:.82rem;border:0;background:transparent;color:var(--muted);padding:7px 15px;border-radius:999px;cursor:pointer;transition:all .3s}
  .toggle button.active{color:var(--ink);background:linear-gradient(100deg,var(--accent),var(--accent-2));box-shadow:0 4px 14px rgba(var(--glow),.35)}
  .hero{text-align:center;padding:26px 0 20px;position:relative}
  .hero .mascot{width:140px;height:140px;margin:0 auto 4px;animation:bob 3s ease-in-out infinite alternate;filter:drop-shadow(0 10px 18px rgba(var(--glow),.3))}
  .hero h1{font-family:var(--font-display);font-weight:800;font-size:clamp(2.2rem,8vw,3.6rem);line-height:1;letter-spacing:-1.5px}
  .hero h1 .pop{background:linear-gradient(100deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .hero p{color:var(--muted);margin-top:14px;font-size:1.05rem}
  .tools{display:flex;flex-direction:column;gap:14px;margin-top:20px}
  .search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:12px 18px;box-shadow:0 6px 20px rgba(var(--glow),.1)}
  .search svg{width:20px;height:20px;flex:none;opacity:.6}
  .search input{border:0;outline:0;background:transparent;font-family:var(--font-body);font-size:1rem;color:var(--text);width:100%}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{font-family:var(--font-display);font-weight:600;font-size:.82rem;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:7px 14px;border-radius:999px;cursor:pointer;transition:all .2s;white-space:nowrap}
  .chip.active{color:var(--ink);background:linear-gradient(100deg,var(--accent),var(--accent-2));border-color:transparent}
  .count{color:var(--muted);font-size:.82rem;margin:2px 4px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
  a.card{text-decoration:none;color:inherit;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 15px 15px;box-shadow:0 5px 16px rgba(var(--glow),.1);transition:transform .2s,box-shadow .2s;display:block}
  a.card:hover{transform:translateY(-5px);box-shadow:0 16px 30px rgba(var(--glow),.22)}
  .card .emoji{font-size:2.2rem;display:grid;place-items:center;height:66px;border-radius:14px;background:linear-gradient(135deg,rgba(var(--glow),.14),transparent);margin-bottom:11px}
  .card h3{font-family:var(--font-display);font-weight:700;font-size:1rem;line-height:1.15}
  .card p{color:var(--muted);font-size:.78rem;margin-top:3px}
  .badge{position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.7rem;color:var(--ink);background:linear-gradient(100deg,var(--accent),var(--accent-2));box-shadow:0 3px 8px rgba(var(--glow),.4)}
  html[dir="rtl"] .badge{right:auto;left:12px}
  .empty{color:var(--muted);text-align:center;padding:30px;grid-column:1/-1}
  footer{text-align:center;color:var(--muted);font-size:.85rem;margin-top:46px}
  footer a{color:var(--accent);font-weight:600;text-decoration:none}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <div class="glow-orb"></div>
  <div class="wrap">
    <header>
      <div class="brand">
        <svg class="mark" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs><linearGradient id="m-body" x1="56" y1="66" x2="184" y2="194" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent-2)"/></linearGradient></defs>
          <ellipse cx="100" cy="196" rx="15" ry="9" fill="var(--accent)"/><ellipse cx="140" cy="196" rx="15" ry="9" fill="var(--accent)"/>
          <path d="M120 72 L120 50" stroke="var(--accent-2)" stroke-width="8" stroke-linecap="round"/><path d="M120 24 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 Z" fill="#ffd23f"/>
          <ellipse cx="120" cy="130" rx="64" ry="64" fill="url(#m-body)"/>
          <ellipse cx="101" cy="118" rx="14" ry="17" fill="#fff"/><ellipse cx="139" cy="118" rx="14" ry="17" fill="#fff"/>
          <circle cx="104" cy="122" r="7" fill="#20142a"/><circle cx="136" cy="122" r="7" fill="#20142a"/>
          <path d="M108 138 Q120 150 132 138" stroke="#20142a" stroke-width="4" fill="none" stroke-linecap="round"/>
          <circle cx="120" cy="166" r="15" fill="#fff"/><path d="M114 158 L114 174 L129 166 Z" fill="url(#m-body)"/>
        </svg>
        <span class="name">playden</span>
      </div>
      <div class="controls">
        <select class="lang" id="lang" aria-label="Language"><option value="en">English</option><option value="ar">العربية</option><option value="fr">Français</option><option value="es">Español</option></select>
        <div class="toggle" role="group" aria-label="Theme"><button data-set="focus" class="active">Focus</button><button data-set="sunrise">Sunrise</button></div>
      </div>
    </header>

    <section class="hero">
      <svg class="mascot" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs><linearGradient id="h-body" x1="56" y1="66" x2="184" y2="194" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent-2)"/></linearGradient></defs>
        <ellipse cx="100" cy="196" rx="15" ry="9" fill="var(--accent)"/><ellipse cx="140" cy="196" rx="15" ry="9" fill="var(--accent)"/>
        <path d="M60 142 L44 160" stroke="var(--accent)" stroke-width="14" stroke-linecap="round"/><path d="M180 126 L200 96" stroke="var(--accent-2)" stroke-width="14" stroke-linecap="round"/>
        <path d="M120 72 L120 50" stroke="var(--accent-2)" stroke-width="8" stroke-linecap="round"/><path d="M120 22 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 Z" fill="#ffd23f"/>
        <ellipse cx="120" cy="130" rx="64" ry="64" fill="url(#h-body)"/>
        <ellipse cx="101" cy="118" rx="14" ry="17" fill="#fff"/><ellipse cx="139" cy="118" rx="14" ry="17" fill="#fff"/>
        <circle cx="104" cy="122" r="7" fill="#20142a"/><circle cx="136" cy="122" r="7" fill="#20142a"/>
        <circle cx="101.5" cy="119" r="2.6" fill="#fff"/><circle cx="133.5" cy="119" r="2.6" fill="#fff"/>
        <path d="M108 138 Q120 150 132 138" stroke="#20142a" stroke-width="4" fill="none" stroke-linecap="round"/>
        <circle cx="120" cy="166" r="15" fill="#fff"/><path d="M114 158 L114 174 L129 166 Z" fill="url(#h-body)"/>
      </svg>
      <h1><span data-t="h1"></span> <span class="pop" data-t="h2"></span></h1>
      <p data-t="sub"></p>
    </section>

    <div class="tools">
      <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="search" type="search" aria-label="Search games"></label>
      <div class="chips" id="chips"></div>
      <div class="count" id="count"></div>
    </div>
    <div class="grid" id="game-grid"></div>

    <footer><span data-t="footer"></span> · <a href="blog.html" data-t="blog">Blog</a></footer>
  </div>

<script>
  const I18N={
    en:{dir:"ltr",h1:"Train your brain,",h2:"the fun way.",sub:"Free games for memory, logic, focus and speed. Your language, your theme.",footer:"Made for sharper minds · Playden",blog:"Blog",all:"All",searchPh:"Search games…",found:n=>`${n} games`,
        cats:{memory:"Memory",logic:"Logic",focus:"Focus",math:"Math",words:"Words",arcade:"Arcade"}},
    ar:{dir:"rtl",h1:"درّب عقلك،",h2:"بطريقة ممتعة.",sub:"ألعاب مجانية للذاكرة والمنطق والتركيز والسرعة. بلغتك ومظهرك.",footer:"لعقول أكثر حدّة · Playden",blog:"المدونة",all:"الكل",searchPh:"ابحث عن لعبة…",found:n=>`${n} لعبة`,
        cats:{memory:"ذاكرة",logic:"منطق",focus:"تركيز",math:"حساب",words:"كلمات",arcade:"أركيد"}},
    fr:{dir:"ltr",h1:"Entraîne ton cerveau,",h2:"en t'amusant.",sub:"Jeux gratuits de mémoire, logique, concentration et vitesse. Ta langue, ton thème.",footer:"Pour des esprits affûtés · Playden",blog:"Blog",all:"Tout",searchPh:"Rechercher un jeu…",found:n=>`${n} jeux`,
        cats:{memory:"Mémoire",logic:"Logique",focus:"Concentration",math:"Calcul",words:"Mots",arcade:"Arcade"}},
    es:{dir:"ltr",h1:"Entrena tu cerebro,",h2:"jugando.",sub:"Juegos gratis de memoria, lógica, concentración y velocidad. Tu idioma, tu tema.",footer:"Para mentes más ágiles · Playden",blog:"Blog",all:"Todos",searchPh:"Buscar juegos…",found:n=>`${n} juegos`,
        cats:{memory:"Memoria",logic:"Lógica",focus:"Concentración",math:"Cálculo",words:"Palabras",arcade:"Arcade"}}
  };
  // Real, working games — add more by copying a line
  const GAMES=[
    {name:"2048",cat:"logic",emoji:"🔢",file:"2048.html",d:{en:"Merge tiles to 2048",ar:"ادمج للوصول إلى 2048",fr:"Fusionne jusqu'à 2048",es:"Une hasta 2048"}},
    {name:"Memory Match",cat:"memory",emoji:"🧠",file:"memory.html",d:{en:"Find all the pairs",ar:"جد كل الأزواج",fr:"Trouve les paires",es:"Encuentra las parejas"}},
    {name:"Simon",cat:"memory",emoji:"🎵",file:"simon.html",d:{en:"Repeat the sequence",ar:"كرّر التسلسل",fr:"Répète la séquence",es:"Repite la secuencia"}},
    {name:"Sliding Puzzle",cat:"logic",emoji:"🧩",file:"slide.html",d:{en:"Order 1–15",ar:"رتّب 1–15",fr:"Ordonne 1–15",es:"Ordena 1–15"}},
    {name:"Sudoku-style",cat:"logic",emoji:"⬜",file:"lightsout.html",d:{en:"Turn the lights off",ar:"أطفئ الأضواء",fr:"Éteins les lumières",es:"Apaga las luces"}},
    {name:"Minesweeper",cat:"logic",emoji:"💣",file:"minesweeper.html",d:{en:"Avoid the mines",ar:"تجنّب الألغام",fr:"Évite les mines",es:"Evita las minas"}},
    {name:"Tower of Hanoi",cat:"logic",emoji:"🗼",file:"hanoi.html",d:{en:"Move the tower",ar:"انقل البرج",fr:"Déplace la tour",es:"Mueve la torre"}},
    {name:"Code Breaker",cat:"logic",emoji:"🔐",file:"codebreaker.html",d:{en:"Crack the code",ar:"فكّ الشيفرة",fr:"Trouve le code",es:"Descifra el código"}},
    {name:"Tic-Tac-Toe",cat:"logic",emoji:"⭕",file:"tictactoe.html",d:{en:"Beat the computer",ar:"اهزم الكمبيوتر",fr:"Bats l'ordinateur",es:"Vence a la máquina"}},
    {name:"Schulte Table",cat:"focus",emoji:"👁️",file:"schulte.html",d:{en:"Find 1–25 fast",ar:"جد 1–25 بسرعة",fr:"Trouve 1–25 vite",es:"Encuentra 1–25"}},
    {name:"Color Clash",cat:"focus",emoji:"🎨",file:"stroop.html",d:{en:"Name the color",ar:"سمِّ اللون",fr:"Nomme la couleur",es:"Nombra el color"}},
    {name:"Math Blitz",cat:"math",emoji:"➗",file:"math.html",d:{en:"Fast mental math",ar:"حساب ذهني سريع",fr:"Calcul mental rapide",es:"Cálculo mental"}},
    {name:"Word Scramble",cat:"words",emoji:"🔤",file:"scramble.html",d:{en:"Unscramble words",ar:"رتّب الحروف",fr:"Remets les lettres",es:"Ordena las letras"}},
    {name:"Snake",cat:"arcade",emoji:"🐍",file:"snake.html",d:{en:"Classic snake",ar:"ثعبان كلاسيكي",fr:"Serpent classique",es:"Snake clásico"}},
    {name:"Brick Breaker",cat:"arcade",emoji:"🧱",file:"breakout.html",d:{en:"Break the bricks",ar:"حطّم الطوب",fr:"Casse les briques",es:"Rompe los ladrillos"}},
    {name:"Whack-a-Mole",cat:"arcade",emoji:"🔨",file:"whack.html",d:{en:"Tap the moles",ar:"انقر الحيوانات",fr:"Tape les taupes",es:"Golpea los topos"}}
  ];
  const CAT_EMOJI={memory:"🧠",logic:"🧩",focus:"👁️",math:"➗",words:"🔤",arcade:"🕹️"};
  let curCat="all",curQuery="";
  const grid=document.getElementById("game-grid"),chipsEl=document.getElementById("chips"),countEl=document.getElementById("count"),searchEl=document.getElementById("search");
  const T=()=>I18N[document.documentElement.getAttribute("lang")]||I18N.en;
  const langCode=()=>document.documentElement.getAttribute("lang")||"en";
  function cats(){const s=[];GAMES.forEach(g=>{if(!s.includes(g.cat))s.push(g.cat);});return s;}
  function filtered(){const q=curQuery.trim().toLowerCase();return GAMES.filter(g=>(curCat==="all"||g.cat===curCat)&&(q===""||g.name.toLowerCase().includes(q)));}
  function renderChips(){const t=T(),cs=["all",...cats()];chipsEl.innerHTML=cs.map(c=>{const label=c==="all"?t.all:(CAT_EMOJI[c]+" "+t.cats[c]);return `<button class="chip ${c===curCat?"active":""}" data-cat="${c}">${label}</button>`;}).join("");chipsEl.querySelectorAll(".chip").forEach(ch=>ch.addEventListener("click",()=>{curCat=ch.dataset.cat;renderChips();renderGames();}));}
  function renderGames(){const t=T(),lc=langCode(),list=filtered();countEl.textContent=t.found(list.length);grid.innerHTML=list.length?list.map(g=>`<a class="card" href="${g.file}"><span class="badge">▶</span><div class="emoji">${g.emoji}</div><h3>${g.name}</h3><p>${(g.d&&g.d[lc])||""}</p></a>`).join(""):`<div class="empty">🔍</div>`;}
  function applyLang(code){const t=I18N[code],html=document.documentElement;html.setAttribute("lang",code);html.setAttribute("dir",t.dir);document.querySelectorAll("[data-t]").forEach(el=>{el.textContent=t[el.dataset.t];});searchEl.placeholder=t.searchPh;renderChips();renderGames();}
  searchEl.addEventListener("input",e=>{curQuery=e.target.value;renderGames();});
  document.getElementById("lang").addEventListener("change",e=>applyLang(e.target.value));
  const buttons=document.querySelectorAll(".toggle button");
  buttons.forEach(btn=>btn.addEventListener("click",()=>{document.documentElement.setAttribute("data-theme",btn.dataset.set);buttons.forEach(b=>b.classList.remove("active"));btn.classList.add("active");}));
  applyLang("en");
  console.log("Games:",GAMES.length);
</script></body></html>
