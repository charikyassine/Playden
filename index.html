<head>

<style>
  :root { --font-display:'Baloo 2',system-ui,sans-serif; --font-body:'Inter',system-ui,sans-serif; }
  html[lang="ar"] { --font-display:'Cairo',system-ui,sans-serif; --font-body:'Cairo',system-ui,sans-serif; }
  [data-theme="nova"] { --bg:#fff0f6; --bg2:#ffe1ee; --surface:#fff; --surface-2:#ffe9f2; --accent:#ff2e88; --accent-2:#ff7a3d; --text:#2a0f1e; --muted:#a25c7d; --line:rgba(255,46,136,.16); --glow:255,46,136; --ink:#fff; }
  [data-theme="volt"] { --bg:#eafaff; --bg2:#d5f4ff; --surface:#fff; --surface-2:#e2f7ff; --accent:#00b8d4; --accent-2:#12c46b; --text:#062033; --muted:#3f7d95; --line:rgba(0,184,212,.16); --glow:0,184,212; --ink:#fff; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { background:linear-gradient(160deg,var(--bg),var(--bg2)); background-attachment:fixed; color:var(--text); font-family:var(--font-body); min-height:100vh; transition:background .5s ease,color .5s ease; overflow-x:hidden; }
  .glow-orb { position:fixed; top:-25%; left:50%; transform:translateX(-50%); width:720px; height:720px; max-width:130vw; background:radial-gradient(circle,rgba(var(--glow),.22),transparent 62%); pointer-events:none; z-index:0; transition:background .5s ease; animation:float 8s ease-in-out infinite alternate; }
  @keyframes float { from{transform:translateX(-50%) translateY(0) scale(1);} to{transform:translateX(-50%) translateY(30px) scale(1.08);} }
  @keyframes bob { from{transform:translateY(0) rotate(-2deg);} to{transform:translateY(-14px) rotate(2deg);} }
  @keyframes bob2 { from{transform:translateY(-8px);} to{transform:translateY(8px);} }
  .wrap { position:relative; z-index:1; max-width:1060px; margin:0 auto; padding:22px 20px 60px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:10px; }
  .brand .mark { width:42px; height:42px; }
  .brand .name { font-family:var(--font-display); font-weight:800; font-size:1.55rem; letter-spacing:-.5px; background:linear-gradient(100deg,var(--accent),var(--accent-2)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .controls { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  select.lang { font-family:var(--font-body); font-weight:600; font-size:.82rem; color:var(--text); background:var(--surface); border:1px solid var(--line); outline:0; padding:8px 12px; border-radius:999px; cursor:pointer; }
  .toggle { display:inline-flex; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:4px; gap:2px; }
  .toggle button { font-family:var(--font-display); font-weight:600; font-size:.82rem; border:0; background:transparent; color:var(--muted); padding:7px 15px; border-radius:999px; cursor:pointer; transition:all .3s ease; }
  .toggle button.active { color:var(--ink); background:linear-gradient(100deg,var(--accent),var(--accent-2)); box-shadow:0 4px 14px rgba(var(--glow),.35); }
  .hero { text-align:center; padding:26px 0 22px; position:relative; }
  .hero .mascot { width:140px; height:140px; margin:0 auto 4px; animation:bob 3s ease-in-out infinite alternate; filter:drop-shadow(0 10px 18px rgba(var(--glow),.3)); }
  .hero .peek { position:absolute; width:60px; height:60px; top:34px; opacity:.95; animation:bob2 2.6s ease-in-out infinite alternate; }
  .hero .peek.left { left:6%; } .hero .peek.right { right:6%; animation-delay:.6s; }
  .hero h1 { font-family:var(--font-display); font-weight:800; font-size:clamp(2.3rem,8.5vw,4rem); line-height:.98; letter-spacing:-1.5px; }
  .hero h1 .pop { background:linear-gradient(100deg,var(--accent),var(--accent-2)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .hero p { color:var(--muted); margin-top:14px; font-size:1.05rem; }
  .tools { display:flex; flex-direction:column; gap:14px; margin-top:20px; }
  .search { display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:12px 18px; box-shadow:0 6px 20px rgba(var(--glow),.10); }
  .search svg { width:20px; height:20px; flex:none; opacity:.6; }
  .search input { border:0; outline:0; background:transparent; font-family:var(--font-body); font-size:1rem; color:var(--text); width:100%; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { font-family:var(--font-display); font-weight:600; font-size:.82rem; border:1px solid var(--line); background:var(--surface); color:var(--muted); padding:7px 14px; border-radius:999px; cursor:pointer; transition:all .2s ease; white-space:nowrap; }
  .chip.active { color:var(--ink); background:linear-gradient(100deg,var(--accent),var(--accent-2)); border-color:transparent; }
  .count { color:var(--muted); font-size:.82rem; margin:2px 4px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:13px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px 14px 14px; cursor:pointer; transition:transform .2s ease,box-shadow .2s ease; box-shadow:0 5px 16px rgba(var(--glow),.08); }
  .card:hover { transform:translateY(-5px); box-shadow:0 14px 28px rgba(var(--glow),.20); }
  .card .emoji { font-size:2rem; display:grid; place-items:center; height:62px; border-radius:14px; background:linear-gradient(135deg,rgba(var(--glow),.14),transparent); margin-bottom:10px; }
  .card h3 { font-family:var(--font-display); font-weight:600; font-size:.95rem; line-height:1.15; }
  .card span { color:var(--muted); font-size:.76rem; }
  a.card { text-decoration:none; color:inherit; display:block; position:relative; }
  a.card.play { box-shadow:0 5px 16px rgba(var(--glow),.20), inset 0 0 0 1.5px rgba(var(--glow),.5); }
  a.card.play:hover { box-shadow:0 16px 30px rgba(var(--glow),.28), inset 0 0 0 1.5px rgba(var(--glow),.7); }
  .badge { position:absolute; top:10px; right:10px; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font-size:.7rem; color:var(--ink); background:linear-gradient(100deg,var(--accent),var(--accent-2)); box-shadow:0 3px 8px rgba(var(--glow),.4); }
  html[dir="rtl"] .badge { right:auto; left:10px; }
  .empty { color:var(--muted); text-align:center; padding:30px; grid-column:1/-1; }
  .more-wrap { text-align:center; margin-top:22px; }
  .more { font-family:var(--font-display); font-weight:700; font-size:.95rem; color:var(--ink); background:linear-gradient(100deg,var(--accent),var(--accent-2)); border:0; padding:12px 28px; border-radius:999px; cursor:pointer; box-shadow:0 8px 22px rgba(var(--glow),.32); }
  .more:disabled { opacity:0; pointer-events:none; }
  .section-label { font-family:var(--font-display); font-weight:700; font-size:1.3rem; margin:38px 4px 16px; }
  .crew { display:flex; flex-wrap:wrap; gap:14px; justify-content:center; }
  .buddy { background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:16px 10px 12px; width:118px; text-align:center; box-shadow:0 6px 18px rgba(var(--glow),.10); transition:transform .25s ease, box-shadow .25s ease; }
  .buddy:hover { transform:translateY(-6px); box-shadow:0 12px 26px rgba(var(--glow),.22); }
  .buddy svg { width:72px; height:72px; animation:bob 3s ease-in-out infinite alternate; }
  .buddy:nth-child(2n) svg { animation-delay:.5s; } .buddy:nth-child(3n) svg { animation-delay:1s; }
  .buddy .bname { font-family:var(--font-display); font-weight:700; font-size:.95rem; margin-top:6px; }
  footer { text-align:center; color:var(--muted); font-size:.85rem; margin-top:46px; }
  footer a { color:var(--accent); font-weight:600; text-decoration:none; }
  @media (prefers-reduced-motion:reduce) { * { animation:none !important; transition:none !important; } }
  @media (max-width:520px){ .hero .peek{ display:none; } }
</style>

    platformer:["Aqua Jump","Sky Hopper","Jungle Leap","Robot Run","Ninja Climb","Lava Leap","Cave Dash","Cloud Bounce","Pixel Quest","Slime Slide","Star Skip","Gravity Guy"]
  };
  const ADJ = ["Turbo","Neon","Pixel","Mega","Super","Hyper","Cosmic","Rapid","Wild","Epic","Mighty","Blazing","Frost","Shadow","Golden","Crystal","Rocket","Thunder","Lucky","Crazy","Astro","Galaxy","Volt","Storm","Jelly"];
  const NOUN = {
    arcade:["Blast","Dodge","Rush","Pop","Zap","Runner","Muncher","Breaker","Shooter","Loop"],
    brain:["Puzzle","Logic","Match","Tiles","Blocks","Riddle","Maze","Cipher","Nest","Twist"],
    racing:["Racer","Drift","Dash","Kart","Moto","Speedway","Rally","Circuit","Nitro","Track"],
    casual:["Match","Pop","Merge","Bubbles","Candy","Jelly","Cookie","Tap","Idle","Farm"],
    sports:["Kick","Dunk","Goal","Serve","Slam","Sprint","Strike","Pitch","Bowl","Rally"],
    classic:["Snake","Blocks","Paddle","Bricks","Mines","Dots","Lines","Grid","Board","Match"],
    cards:["Solitaire","Poker","Rummy","Hearts","Spades","Pyramid","Klondike","Memory","Deck","Match"],
    creative:["Draw","Paint","Beat","Doodle","Melody","Studio","Color","Piano","Comic","Pixels"],
    strategy:["Empire","Castle","Tower","Kingdom","Army","Base","Defense","Clash","Siege","Command"],
    platformer:["Jump","Hopper","Leap","Climb","Dash","Bounce","Runner","Quest","Slide","Skip"]
  };
  const PER_CAT = 52;
  // ▶ REAL PLAYABLE GAMES — to add an open-source game, copy a line here:
  // { name:"Game Name", cat:"brain", emoji:"🔷", file:"games/yourgame/index.html" }
  const PLAYABLE = [
    { name:"Snake",        cat:"classic",    emoji:"🐍", file:"snake.html" },
    { name:"2048",         cat:"brain",      emoji:"🔢", file:"2048.html" },
    { name:"Memory Match", cat:"brain",      emoji:"🧠", file:"memory.html" },
    { name:"Tic-Tac-Toe",  cat:"classic",    emoji:"⭕", file:"tictactoe.html" },
    { name:"Minesweeper",  cat:"classic",    emoji:"💣", file:"minesweeper.html" },
    { name:"Brick Breaker",cat:"arcade",     emoji:"🧱", file:"breakout.html" },
    { name:"Whack-a-Mole", cat:"arcade",     emoji:"🔨", file:"whack.html" }
  ];

  const GAMES = [];
  PLAYABLE.forEach(g=>GAMES.push(g)); // real games first
  const playableNames = new Set(PLAYABLE.map(g=>g.name));
  Object.keys(NOUN).forEach(cat=>{
    const seen=new Set(), out=[];
    (CURATED[cat]||[]).forEach(n=>{ if(!seen.has(n)){seen.add(n);out.push(n);} });
    outer: for(const a of ADJ){ for(const n of NOUN[cat]){ const nm=a+" "+n; if(!seen.has(nm)){seen.add(nm);out.push(nm);} if(out.length>=PER_CAT) break outer; } }
    out.forEach(name=>{ if(!playableNames.has(name)) GAMES.push({name,cat}); });
  });

  const PAGE = 60;
  let curCat="all", curQuery="", shown=PAGE;
  const grid=document.getElementById("game-grid"), chipsEl=document.getElementById("chips"),
        countEl=document.getElementById("count"), searchEl=document.getElementById("search"), moreBtn=document.getElementById("more");
  const T = () => I18N[document.documentElement.getAttribute("lang")] || I18N.en;

  function filtered(){
    const q=curQuery.trim().toLowerCase();
    return GAMES.filter(g => (curCat==="all"||g.cat===curCat) && (q===""||g.name.toLowerCase().includes(q)));
  }
  function renderChips(){
    const t=T(), cats=["all",...Object.keys(NOUN)];
    chipsEl.innerHTML = cats.map(c=>{ const label=c==="all"?t.all:(CAT_EMOJI[c]+" "+t.cats[c]); return `<button class="chip ${c===curCat?"active":""}" data-cat="${c}">${label}</button>`; }).join("");
    chipsEl.querySelectorAll(".chip").forEach(ch=>ch.addEventListener("click",()=>{ curCat=ch.dataset.cat; shown=PAGE; renderChips(); renderGames(); }));
  }
  function renderGames(){
    const t=T(), list=filtered();
    countEl.textContent = t.found(list.length);
    const page=list.slice(0,shown);
    grid.innerHTML = page.length ? page.map(g=>{
      const emoji=g.emoji||CAT_EMOJI[g.cat];
      const inner=`<div class="emoji">${emoji}</div><h3>${g.name}</h3><span>${t.cats[g.cat]}</span>`;
      return g.file
        ? `<a class="card play" href="${g.file}"><span class="badge">▶</span>${inner}</a>`
        : `<div class="card">${inner}</div>`;
    }).join("") : `<div class="empty">🔍</div>`;
    moreBtn.textContent = t.more;
    moreBtn.disabled = shown>=list.length;
  }
  function applyLang(code){
    const t=I18N[code], html=document.documentElement;
    html.setAttribute("lang",code); html.setAttribute("dir",t.dir);
    document.querySelectorAll("[data-t]").forEach(el=>{ el.textContent=t[el.dataset.t]; });
    searchEl.placeholder=t.searchPh; renderChips(); renderGames();
  }
  searchEl.addEventListener("input",e=>{ curQuery=e.target.value; shown=PAGE; renderGames(); });
  moreBtn.addEventListener("click",()=>{ shown+=PAGE; renderGames(); });
  document.getElementById("lang").addEventListener("change",e=>applyLang(e.target.value));
  const buttons=document.querySelectorAll(".toggle button");
  buttons.forEach(btn=>btn.addEventListener("click",()=>{
    document.documentElement.setAttribute("data-theme",btn.dataset.set);
    buttons.forEach(b=>{b.classList.remove("active");b.setAttribute("aria-pressed","false");});
    btn.classList.add("active"); btn.setAttribute("aria-pressed","true");
  }));
  applyLang("en");
  console.log("Total games:", GAMES.length);
</script>
</body>
</html>
